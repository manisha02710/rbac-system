<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - RBAC College System</title>
    <!-- Google Font: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Style CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <!-- Login Lock Animated CSS -->
    <link rel="stylesheet" th:href="@{/css/login-lock.css}" />
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #000000 0%, #0d0d0d 50%, #2b0006 100%);
            padding: 1.5rem;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: #1a1a1a;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
            border-top: 5px solid var(--primary-red);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            transition: transform 0.2s ease;
        }
        .login-header {
            background-color: #000000;
            padding: 1.75rem 1.5rem 1.25rem;
            text-align: center;
            border-bottom: 2px solid var(--primary-red);
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle mb-2" style="background-color: #121212; border: 1px solid var(--primary-red);">
                    <i class="bi bi-shield-lock-fill text-danger fs-2"></i>
                </div>
                <h3 class="text-white fw-bold mb-0">RBAC <span class="text-danger">COLLEGE</span></h3>
                <p class="text-muted small mb-0">Sign in to your campus account</p>
            </div>
            <div class="p-4 p-sm-5" style="background-color: #1a1a1a;">
                <!-- Animated Lock & Interactive Status (Centered above form fields) -->
                <div class="lock-container text-center mb-3">
                    <div class="lock-svg-wrapper">
                        <svg class="lock-svg" width="64" height="80" viewBox="0 0 64 80" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <!-- Padlock Shackle -->
                            <g class="lock-shackle-group">
                                <path class="lock-shackle" d="M 18,34 L 18,22 C 18,13.5 24.2,7.5 32,7.5 C 39.8,7.5 46,13.5 46,22 L 46,34" 
                                      fill="none" stroke="#d90429" stroke-width="6" stroke-linecap="round" />
                            </g>
                            <!-- Padlock Body -->
                            <rect class="lock-body" x="10" y="30" width="44" height="42" rx="8" ry="8" fill="#d90429" />
                            <!-- Padlock Dark Keyhole -->
                            <path class="lock-keyhole" d="M 32,45 A 4.5,4.5 0 0,0 29.5,52.2 L 28.5,59.5 C 28.5,60.5 29.3,61 30.2,61 L 33.8,61 C 34.7,61 35.5,60.5 35.5,59.5 L 34.5,52.2 A 4.5,4.5 0 0,0 32,45 Z" fill="#111111" />
                        </svg>
                        <div class="sparks-container" aria-hidden="true"></div>
                    </div>
                    <div id="lockMsg" class="lock-msg mt-2" aria-live="polite">Enter your credentials to unlock</div>
                </div>

                <!-- Server-Side Error Alert (Fallback when JS disabled or direct link) -->
                <div th:if="${error}" class="alert alert-danger d-flex align-items-center py-2" role="alert" id="serverErrorAlert">
                    <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                    <div th:text="${error}">Invalid username or password</div>
                </div>

                <!-- Server-Side Logout Alert (Fallback when JS disabled or direct link) -->
                <div th:if="${param.logout != null}" class="alert alert-success d-flex align-items-center py-2" role="alert" id="serverLogoutAlert">
                    <i class="bi bi-check-circle-fill me-2 fs-5"></i>
                    <div>You have been logged out successfully.</div>
                </div>
                <div th:if="${logout}" class="alert alert-success d-flex align-items-center py-2" role="alert" id="serverLogoutAlertAlt">
                    <i class="bi bi-check-circle-fill me-2 fs-5"></i>
                    <div th:text="${logout}">You have been logged out successfully.</div>
                </div>

                <!-- Login Form -->
                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold text-white">Username</label>
                        <div class="input-group">
                            <span class="input-group-text border-end-0"><i class="bi bi-person"></i></span>
                            <input type="text" id="username" name="username" class="form-control border-start-0 ps-0" placeholder="Enter username" required autofocus />
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold text-white">Password</label>
                        <div class="input-group">
                            <span class="input-group-text border-end-0"><i class="bi bi-key"></i></span>
                            <input type="password" id="password" name="password" class="form-control border-start-0 border-end-0 ps-0" placeholder="Enter password" required />
                            <button type="button" class="btn toggle-password-btn" id="togglePasswordBtn" title="Show password" aria-label="Toggle password visibility">
                                <i class="bi bi-eye" id="togglePasswordIcon"></i>
                            </button>
                        </div>
                        <!-- Caps Lock Warning -->
                        <div id="capsLockWarning" class="caps-warning d-none">
                            <i class="bi bi-exclamation-triangle-fill me-1"></i>Caps Lock is on
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fs-6 shadow-sm">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Log In
                    </button>
                </form>

                <div class="mt-4 pt-3 border-top text-center text-muted small" style="border-color: #2a2a2a !important;">
                    Default accounts: <span class="badge badge-dark-custom">admin</span>, 
                    <span class="badge badge-dark-custom">faculty</span>, 
                    <span class="badge badge-dark-custom">student1</span>
                </div>
            </div>
        </div>
    </div>
    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Login Lock JS -->
    <script th:src="@{/js/login-lock.js}"></script>
</body>
</html>
