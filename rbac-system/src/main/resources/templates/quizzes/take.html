<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Taking Quiz')}">
    <title>Taking Quiz</title>
</head>
<body style="background-color: #0d0d0d;">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="app-container">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <main class="app-content">
        <!-- Flash messages -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show d-flex align-items-center mb-3" role="alert">
            <i class="bi bi-check-circle-fill me-2 fs-5"></i>
            <span th:text="${success}">Success message</span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center mb-3" role="alert">
            <i class="bi bi-exclamation-octagon-fill me-2 fs-5"></i>
            <span th:text="${error}">Error message</span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Floating / Sticky Timer Header -->
        <div class="card card-theme p-3 mb-4 sticky-top border-danger" style="top: 70px; z-index: 1020; box-shadow: 0 4px 20px rgba(0,0,0,0.8);">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div>
                    <h4 class="text-white fw-bold mb-0" th:text="${quiz.title}">Quiz Title</h4>
                    <span class="badge bg-dark border border-secondary text-info" th:text="${quiz.courseCode}">CS101</span>
                    <span class="small text-muted ms-2" th:text="${#lists.size(questions) + ' Questions'}">5 Questions</span>
                    <span th:if="${attempt.extraMinutes > 0}" class="badge bg-info text-dark ms-2" th:text="'+' + ${attempt.extraMinutes} + ' extra mins granted'">+5 mins granted</span>
                </div>

                <div class="d-flex align-items-center gap-3">
                    <!-- Extension Request Status / Button -->
                    <div class="d-flex align-items-center">
                        <th:block th:if="${latestRequest != null}">
                            <span th:if="${latestRequest.pending}" class="badge bg-warning text-dark me-2">
                                <i class="bi bi-clock me-1"></i>Request Pending (+<span th:text="${latestRequest.requestedMinutes}">5</span>m)
                            </span>
                            <span th:if="${latestRequest.approved}" class="badge bg-success me-2">
                                <i class="bi bi-check-circle me-1"></i>Request Approved (+<span th:text="${latestRequest.requestedMinutes}">5</span>m)
                            </span>
                            <span th:if="${latestRequest.rejected}" class="badge bg-danger me-2">
                                <i class="bi bi-x-circle me-1"></i>Request Rejected
                            </span>
                        </th:block>
                        <button th:if="${latestRequest == null or !latestRequest.pending}" type="button" class="btn btn-sm btn-outline-warning" data-bs-toggle="modal" data-bs-target="#requestTimeModal">
                            <i class="bi bi-stopwatch me-1"></i> Request More Time
                        </button>
                    </div>

                    <div class="text-end">
                        <div class="small text-muted">Time Remaining</div>
                        <div id="countdownTimer" class="fs-4 fw-bold font-monospace text-danger">--:--</div>
                    </div>
                    <button type="button" class="btn btn-danger fw-bold" onclick="document.getElementById('quizForm').submit();">
                        <i class="bi bi-send-check me-1"></i> Submit Quiz
                    </button>
                </div>
            </div>
        </div>

        <form id="quizForm" th:action="@{/quizzes/{id}/submit(id=${quiz.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}" />
            <div class="d-flex flex-column gap-4 mb-5">
                <div th:each="q, iter : ${questions}" class="card card-theme p-4">
                    <div class="d-flex align-items-start gap-2 mb-3">
                        <span class="badge bg-danger fs-6" th:text="'Q' + ${iter.count}">Q1</span>
                        <div>
                            <h5 class="text-white fw-bold mb-1" th:text="${q.questionText}">Question description</h5>
                            <span class="badge bg-secondary text-white" th:text="${q.marks + ' pts'}">1 pt</span>
                        </div>
                    </div>

                    <div class="d-flex flex-column gap-2">
                        <!-- Option A -->
                        <label class="p-3 rounded border border-secondary d-flex align-items-center gap-3 cursor-pointer quiz-option" style="background: #121212;">
                            <input class="form-check-input mt-0" type="radio" th:name="'answer_' + ${q.id}" value="A" />
                            <div>
                                <span class="badge bg-secondary me-2">A</span>
                                <span class="text-white" th:text="${q.optionA}">Option A text</span>
                            </div>
                        </label>

                        <!-- Option B -->
                        <label class="p-3 rounded border border-secondary d-flex align-items-center gap-3 cursor-pointer quiz-option" style="background: #121212;">
                            <input class="form-check-input mt-0" type="radio" th:name="'answer_' + ${q.id}" value="B" />
                            <div>
                                <span class="badge bg-secondary me-2">B</span>
                                <span class="text-white" th:text="${q.optionB}">Option B text</span>
                            </div>
                        </label>

                        <!-- Option C -->
                        <label class="p-3 rounded border border-secondary d-flex align-items-center gap-3 cursor-pointer quiz-option" style="background: #121212;">
                            <input class="form-check-input mt-0" type="radio" th:name="'answer_' + ${q.id}" value="C" />
                            <div>
                                <span class="badge bg-secondary me-2">C</span>
                                <span class="text-white" th:text="${q.optionC}">Option C text</span>
                            </div>
                        </label>

                        <!-- Option D -->
                        <label class="p-3 rounded border border-secondary d-flex align-items-center gap-3 cursor-pointer quiz-option" style="background: #121212;">
                            <input class="form-check-input mt-0" type="radio" th:name="'answer_' + ${q.id}" value="D" />
                            <div>
                                <span class="badge bg-secondary me-2">D</span>
                                <span class="text-white" th:text="${q.optionD}">Option D text</span>
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Bottom Submit Button -->
            <div class="text-center mb-5">
                <button type="submit" class="btn btn-primary btn-lg px-5">
                    <i class="bi bi-check2-circle me-2"></i> Submit and Complete Quiz
                </button>
            </div>
        </form>
    </main>
</div>

<!-- Request Time Modal -->
<div class="modal fade" id="requestTimeModal" tabindex="-1" aria-labelledby="requestTimeModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content card-theme border-warning">
            <div class="modal-header border-secondary">
                <h5 class="modal-title text-white fw-bold" id="requestTimeModalLabel">
                    <i class="bi bi-hourglass-split text-warning me-2"></i>Request More Time
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/quizzes/{id}/request-extension(id=${quiz.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}" />
                <input type="hidden" name="source" value="take" />
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label text-white-50">Requested Extension (Minutes) <span class="text-danger">*</span></label>
                        <input type="number" name="requestedMinutes" class="form-control" value="5" min="1" max="30" required />
                        <div class="form-text text-muted">You can request between 1 and 30 additional minutes.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-white-50">Reason for Request <span class="text-danger">*</span></label>
                        <textarea name="reason" class="form-control" rows="3" placeholder="Explain why you require extra time (e.g., technical issue, network delay)..." required></textarea>
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-warning text-dark fw-bold">
                        <i class="bi bi-send me-1"></i> Send Request
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    var remainingSeconds = /*[[${remainingSeconds}]]*/ 900;

    function updateDisplay(seconds) {
        var m = Math.floor(seconds / 60);
        var s = seconds % 60;
        var display = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
        var el = document.getElementById('countdownTimer');
        if (el) {
            el.innerText = display;
            if (seconds <= 60) {
                el.classList.add('animate-pulse');
                el.style.color = '#ff0033';
            }
        }
    }

    updateDisplay(remainingSeconds);

    var timerInterval = setInterval(function() {
        remainingSeconds--;
        if (remainingSeconds <= 0) {
            clearInterval(timerInterval);
            updateDisplay(0);
            alert('Time is up! Your quiz attempt will now be submitted.');
            document.getElementById('quizForm').submit();
        } else {
            updateDisplay(remainingSeconds);
        }
    }, 1000);
    /*]]>*/
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
