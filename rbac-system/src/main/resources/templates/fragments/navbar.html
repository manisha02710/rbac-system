<!-- Top Navbar Fragment -->
<nav class="navbar navbar-expand navbar-dark top-navbar px-3 px-lg-4" th:fragment="navbar">
    <div class="container-fluid p-0">
        <!-- Sidebar Toggle Buttons (Desktop Collapsed & Mobile Drawer) -->
        <div class="d-flex align-items-center">
            <button class="btn btn-outline-danger btn-sm me-2 d-none d-lg-inline-flex align-items-center justify-content-center" 
                    type="button" id="sidebarCollapseBtn" title="Toggle Sidebar">
                <i class="bi bi-layout-sidebar-inset fs-6"></i>
            </button>
            <button class="btn btn-outline-danger btn-sm me-2 d-lg-none align-items-center justify-content-center" 
                    type="button" id="sidebarToggle" aria-label="Toggle Mobile Navigation">
                <i class="bi bi-list fs-5"></i>
            </button>

            <!-- Brand Logo & Name -->
            <a class="navbar-brand d-flex align-items-center me-3" th:href="@{/dashboard}">
                <div class="rounded-circle d-flex align-items-center justify-content-center me-2" 
                     style="width: 32px; height: 32px; background: linear-gradient(135deg, #d90429 0%, #700010 100%); box-shadow: 0 0 12px rgba(217, 4, 41, 0.5);">
                    <i class="bi bi-shield-lock-fill text-white fs-6"></i>
                </div>
                <span class="fw-bold tracking-tight text-white"><span class="text-danger">RBAC</span> Portal</span>
            </a>
        </div>

        <!-- Right Side: User Profile & Logout -->
        <div class="ms-auto d-flex align-items-center gap-3">
            <div th:if="${sessionUser != null}" class="d-flex align-items-center">
                <!-- User Avatar Initial -->
                <div class="rounded-circle d-flex align-items-center justify-content-center text-white fw-bold me-2 user-avatar-badge"
                     style="width: 36px; height: 36px; background: linear-gradient(135deg, #d90429 0%, #4a000c 100%); border: 2px solid #d90429; font-size: 0.95rem; box-shadow: 0 0 10px rgba(217, 4, 41, 0.4);"
                     th:text="${sessionUser.fullName != null and !sessionUser.fullName.isEmpty() ? #strings.toUpperCase(#strings.substring(sessionUser.fullName, 0, 1)) : 'U'}">
                    A
                </div>

                <!-- User Name & Role Badge -->
                <div class="text-end d-none d-sm-block me-1">
                    <div class="fw-semibold text-white small" th:text="${sessionUser.fullName}">User Name</div>
                    <span class="badge" style="background: linear-gradient(135deg, #d90429, #700010); color: #ffffff; font-size: 0.7rem; border: 1px solid rgba(255, 77, 109, 0.3);"
                          th:text="${activeUser != null ? activeUser.roleLabel : (sessionUser.roleName != null ? sessionUser.roleName : 'User')}">Role</span>
                </div>
            </div>

            <!-- Logout Button -->
            <a th:href="@{/logout}" class="btn btn-sm btn-outline-danger d-flex align-items-center px-3" title="Log Out">
                <i class="bi bi-box-arrow-right me-1"></i>
                <span class="d-none d-md-inline">Logout</span>
            </a>
        </div>
    </div>
</nav>
