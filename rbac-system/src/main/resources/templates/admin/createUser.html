<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Create User')}">
    <title>Create User</title>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="app-container">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <main class="app-content" th:fragment="content">
        <!-- Breadcrumbs -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/dashboard}">Portal</a></li>
                <li class="breadcrumb-item"><a th:href="@{/admin/users}">Users</a></li>
                <li class="breadcrumb-item active" aria-current="page">Create User</li>
            </ol>
        </nav>

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h1 class="h3 fw-bold mb-1 text-white">Create New User</h1>
                <p class="text-muted mb-0">Register a new account in the RBAC system</p>
            </div>
            <a th:href="@{/admin/users}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i> Back to Users
            </a>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card card-theme p-4 border-danger">
                    <form method="post" th:action="@{/admin/users/create}" class="p-0 m-0 bg-transparent shadow-none border-0">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="username" class="form-label text-white fw-semibold">Username *</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" id="username" name="username" class="form-control" placeholder="e.g. john_doe" minlength="3" maxlength="20" required />
                                </div>
                                <div class="form-text text-muted">Must be 3–20 characters.</div>
                            </div>
                            <div class="col-md-6">
                                <label for="password" class="form-label text-white fw-semibold">Password *</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-key"></i></span>
                                    <input type="password" id="password" name="password" class="form-control" placeholder="Min 6 characters" minlength="6" required />
                                    <button type="button" class="btn password-toggle-btn" data-target="password" title="Toggle visibility">
                                        <i class="bi bi-eye-fill"></i>
                                    </button>
                                </div>
                                <div class="form-text text-muted">Minimum 6 characters.</div>
                            </div>
                            <div class="col-md-6">
                                <label for="fullName" class="form-label text-white fw-semibold">Full Name *</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-card-text"></i></span>
                                    <input type="text" id="fullName" name="fullName" class="form-control" placeholder="e.g. John Doe" required />
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label text-white fw-semibold">Email Address *</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="email" id="email" name="email" class="form-control" placeholder="user@college.edu" required />
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="form-check form-switch mt-2">
                                    <input class="form-check-input" type="checkbox" name="active" value="true" id="active" checked />
                                    <label class="form-check-label fw-semibold text-white" for="active">Account Active</label>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top border-dark">
                            <a th:href="@{/admin/users}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary d-flex align-items-center">
                                <i class="bi bi-check-circle-fill me-2"></i> Create User
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
