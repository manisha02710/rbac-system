<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Audit Logs (Admin)</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="container">
    <h2>Audit Logs</h2>
    <form method="get" th:action="@{/audit}">
        <label for="status">Filter by Status:</label>
        <select name="status" id="status">
            <option th:value="" th:selected="${selectedStatus == null}">All</option>
            <option th:each="s : ${T(com.rbac.model.AuditLog$Status).values()}"
                    th:value="${s.name()}"
                    th:text="${s.name()}"
                    th:selected="${s.name() == selectedStatus}"></option>
        </select>
        <button type="submit">Filter</button>
    </form>
    <table>
        <thead>
        <tr>
            <th>ID</th><th>User ID</th><th>Action</th><th>Status</th><th>Timestamp</th><th>Details</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="log : ${logs}">
            <td th:text="${log.id}"></td>
            <td th:text="${log.userId}"></td>
            <td th:text="${log.action}"></td>
            <td th:text="${log.status}"></td>
            <td th:text="${log.createdAt}"></td>
            <td th:text="${log.details}"></td>
        </tr>
        </tbody>
    </table>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
