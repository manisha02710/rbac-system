<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Create Role')}">
    <title>Create Role</title>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="app-container">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <main class="app-content" th:fragment="content">
        <!-- Breadcrumbs -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/dashboard}">Portal</a></li>
                <li class="breadcrumb-item"><a th:href="@{/admin/roles}">Roles</a></li>
                <li class="breadcrumb-item active" aria-current="page">Create Role</li>
            </ol>
        </nav>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 fw-bold mb-1 text-white">Create New Role</h1>
                <p class="text-muted mb-0">Define a new authority level in the system</p>
            </div>
            <a th:href="@{/admin/roles}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i> Back to Roles
            </a>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card card-theme p-4">
                    <form method="post" th:action="@{/admin/roles/create}" class="p-0 m-0 bg-transparent shadow-none border-0">
                        <div class="mb-3">
                            <label for="roleName" class="form-label fw-semibold text-white">Role Name</label>
                            <input type="text" id="roleName" name="roleName" class="form-control" placeholder="e.g. DEAN, COORDINATOR" required />
                            <small class="text-muted">Must be between 3 and 30 characters.</small>
                        </div>
                        <div class="mb-4">
                            <label for="description" class="form-label fw-semibold text-white">Description</label>
                            <textarea id="description" name="description" class="form-control" rows="3" placeholder="Describe the responsibilities and privileges of this role..."></textarea>
                        </div>
                        <div class="pt-2 border-top d-flex gap-2" style="border-color: #2a2a2a !important;">
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-shield-check me-1"></i> Create Role
                            </button>
                            <a th:href="@{/admin/roles}" class="btn btn-outline-secondary px-3">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
