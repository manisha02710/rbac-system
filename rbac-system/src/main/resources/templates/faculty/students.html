<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Faculty - Student Directory')}">
    <title>Faculty - Students</title>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="app-container">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <main class="app-content" th:fragment="content">
        <!-- Breadcrumbs -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/dashboard}">Portal</a></li>
                <li class="breadcrumb-item active" aria-current="page">Students</li>
            </ol>
        </nav>

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h1 class="h3 fw-bold mb-1 text-white">Student Directory</h1>
                <p class="text-muted mb-0">Roster of registered students in your department</p>
            </div>
            <div th:if="${sessionUser != null and sessionUser.permissions.contains('STUDENT_CREATE')}">
                <a th:href="@{/faculty/students/new}" class="btn btn-primary d-flex align-items-center">
                    <i class="bi bi-person-plus-fill me-2"></i> Add Student
                </a>
            </div>
        </div>

        <!-- Feedback Alerts -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show d-flex align-items-center" role="alert">
            <i class="bi bi-check-circle-fill me-2 fs-5"></i>
            <span th:text="${success}">Operation successful.</span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center" role="alert">
            <i class="bi bi-exclamation-octagon-fill me-2 fs-5"></i>
            <span th:text="${error}">An error occurred.</span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card card-theme p-0 overflow-hidden">
            <div class="table-responsive">
                <table class="table table-hover table-theme mb-0">
                    <thead>
                        <tr>
                            <th style="width: 90px;">Student ID</th>
                            <th>Student Name</th>
                            <th style="width: 140px;">Roll Number</th>
                            <th>Department</th>
                            <th style="width: 320px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(students)}">
                            <td colspan="5" class="text-center py-4 text-muted">
                                <i class="bi bi-inbox fs-3 d-block mb-2 text-danger"></i>
                                No records yet
                            </td>
                        </tr>
                        <tr th:each="student : ${students}">
                            <td class="fw-bold text-muted" th:text="${student.id}">1</td>
                            <td class="fw-semibold text-white">
                                <div class="d-flex align-items-center">
                                    <div class="rounded-circle d-flex align-items-center justify-content-center me-2 text-white" 
                                         style="width: 32px; height: 32px; background-color: #2b0a10; border: 1px solid #d90429; font-size: 0.85rem;">
                                        <i class="bi bi-person-fill"></i>
                                    </div>
                                    <span th:text="${student.studentName != null ? student.studentName : 'Student #' + student.id}">Student Name</span>
                                </div>
                            </td>
                            <td>
                                <span class="badge badge-dark-custom font-monospace fs-6" th:text="${student.rollNo}">S001</span>
                            </td>
                            <td>
                                <span class="fw-semibold text-white" th:text="${student.department}">Computer Science</span>
                            </td>
                            <td>
                                <div class="d-flex gap-2">
                                    <a th:href="@{/faculty/student/marks(studentId=${student.id})}" class="btn btn-sm btn-outline-primary d-inline-flex align-items-center">
                                        <i class="bi bi-award me-1"></i> View / Add Marks
                                    </a>
                                    <a th:href="@{/faculty/student/attendance(studentId=${student.id})}" class="btn btn-sm btn-outline-secondary d-inline-flex align-items-center">
                                        <i class="bi bi-calendar-check me-1"></i> Manage Attendance
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
