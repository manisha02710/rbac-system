<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Edit Student Attendance')}">
    <title>Edit Student Attendance</title>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="app-container">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <main class="app-content" th:fragment="content">
        <!-- Breadcrumbs -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/dashboard}">Portal</a></li>
                <li class="breadcrumb-item"><a th:href="@{/faculty/students}">Students</a></li>
                <li class="breadcrumb-item active" aria-current="page">Edit Attendance</li>
            </ol>
        </nav>

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h1 class="h3 fw-bold mb-1 text-white">Edit Attendance Record</h1>
                <p class="text-muted mb-0">Modify subject name, total classes or attended count</p>
            </div>
            <div>
                <a th:href="${returnUrl != null and !#strings.isEmpty(returnUrl) ? returnUrl : '/faculty/student/attendance?studentId=' + attendance.studentId}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Back to Attendance
                </a>
            </div>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center" role="alert">
            <i class="bi bi-exclamation-octagon-fill me-2 fs-5"></i>
            <span th:text="${error}">An error occurred.</span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card card-theme p-4">
                    <form method="post" th:action="@{'/faculty/student/attendance/' + ${attendance.id} + '/edit'}" class="p-0 m-0 bg-transparent shadow-none border-0">
                        <input type="hidden" name="returnUrl" th:if="${returnUrl != null}" th:value="${returnUrl}" />
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-white">Subject</label>
                            <input type="text" name="subject" class="form-control" th:value="${attendance.subject}" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-white">Total Classes</label>
                            <input type="number" name="totalClasses" class="form-control" th:value="${attendance.totalClasses}" min="1" required />
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold text-white">Attended Classes</label>
                            <input type="number" name="attendedClasses" class="form-control" th:value="${attendance.attendedClasses}" min="0" required />
                        </div>
                        <div class="d-flex gap-2 pt-2 border-top" style="border-color: #2a2a2a !important;">
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-check2-circle me-1"></i> Save Changes
                            </button>
                            <a th:href="${returnUrl != null and !#strings.isEmpty(returnUrl) ? returnUrl : '/faculty/student/attendance?studentId=' + attendance.studentId}" class="btn btn-outline-secondary px-3">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
