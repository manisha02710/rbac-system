<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('My Profile')}">
    <title>Student Profile</title>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="app-container">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <main class="app-content" th:fragment="content">
        <!-- Breadcrumbs -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/dashboard}">Portal</a></li>
                <li class="breadcrumb-item active" aria-current="page">My Profile</li>
            </ol>
        </nav>

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h1 class="h3 fw-bold mb-1 text-white">Student Profile</h1>
                <p class="text-muted mb-0">Personal enrollment information and academic credentials</p>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card card-theme p-4" th:if="${student != null}">
                    <div class="d-flex align-items-center mb-4 pb-3 border-bottom flex-wrap gap-3" style="border-color: #2a2a2a !important;">
                        <div class="p-3 text-danger rounded-circle" style="background-color: #121212; border: 1px solid var(--primary-red);">
                            <i class="bi bi-person-bounding-box fs-1"></i>
                        </div>
                        <div>
                            <h4 class="fw-bold mb-1 text-white" th:text="${sessionUser != null ? sessionUser.fullName : 'Student'}">Full Name</h4>
                            <p class="text-muted mb-0">
                                Username: <span class="badge badge-dark-custom font-monospace" th:text="${sessionUser != null ? sessionUser.username : ''}">student1</span>
                            </p>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-bordered mb-0">
                            <tbody>
                                <tr>
                                    <th style="width: 200px; background-color: #161616; color: var(--text-muted);">Student ID</th>
                                    <td class="fw-bold text-white" th:text="${student.id}">1</td>
                                </tr>
                                <tr>
                                    <th style="background-color: #161616; color: var(--text-muted);">Full Name</th>
                                    <td class="text-white" th:text="${sessionUser != null ? sessionUser.fullName : ''}">Student Name</td>
                                </tr>
                                <tr>
                                    <th style="background-color: #161616; color: var(--text-muted);">Username</th>
                                    <td class="text-white" th:text="${sessionUser != null ? sessionUser.username : ''}">username</td>
                                </tr>
                                <tr>
                                    <th style="background-color: #161616; color: var(--text-muted);">Roll Number</th>
                                    <td>
                                        <span class="badge badge-dark-custom font-monospace fs-6" th:text="${student.rollNo}">S001</span>
                                    </td>
                                </tr>
                                <tr>
                                    <th style="background-color: #161616; color: var(--text-muted);">Department</th>
                                    <td class="fw-semibold text-danger" th:text="${student.department}">Computer Science</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="card card-theme p-4 text-center" th:if="${student == null}">
                    <i class="bi bi-person-x text-muted fs-1 mb-2"></i>
                    <p class="text-muted mb-0">No student profile record found for this user account.</p>
                </div>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
