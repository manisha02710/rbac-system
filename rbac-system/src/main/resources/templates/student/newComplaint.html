<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Submit Feedback')}">
    <title>Submit Feedback / Complaint</title>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="app-container">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <main class="app-content" th:fragment="content">
        <!-- Breadcrumbs -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/dashboard}">Portal</a></li>
                <li class="breadcrumb-item"><a th:href="@{/student/complaints}">Feedback</a></li>
                <li class="breadcrumb-item active" aria-current="page">Submit Feedback</li>
            </ol>
        </nav>

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h1 class="h3 fw-bold mb-1 text-white">Submit Feedback or Grievance</h1>
                <p class="text-muted mb-0">Direct communication with administrative authorities</p>
            </div>
            <div>
                <a th:href="@{/student/complaints}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Back to Complaints
                </a>
            </div>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center" role="alert">
            <i class="bi bi-exclamation-octagon-fill me-2 fs-5"></i>
            <span th:text="${error}">An error occurred.</span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card card-theme p-4">
                    <form method="post" th:action="@{/student/complaints/new}" class="p-0 m-0 bg-transparent border-0 shadow-none">
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-white">Category *</label>
                            <select name="category" class="form-select" required>
                                <option value="ACADEMIC" selected>Academic (Curriculum, Grading, Exams)</option>
                                <option value="FACULTY">Faculty (Lectures, Guidance, Timetable)</option>
                                <option value="FACILITY">Facility (Labs, Classrooms, Library, Wi-Fi)</option>
                                <option value="OTHER">Other / General Grievance</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold text-white">Subject *</label>
                            <input type="text" name="subject" class="form-control" placeholder="Brief summary of the issue" maxlength="200" required />
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold text-white">Detailed Description *</label>
                            <textarea name="description" class="form-control" rows="6" placeholder="Provide full context, dates, and relevant details regarding your concern..." required></textarea>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/student/complaints}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary d-flex align-items-center">
                                <i class="bi bi-send-fill me-2"></i> Submit Feedback
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
